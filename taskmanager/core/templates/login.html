{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<div class="container">
    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}
        <input name="username" placeholder="Username">
        <input name="password" type="password" placeholder="Password">
        <button>Login</button>
    </form>

    <a href="/signup">Signup</a>
</div>
